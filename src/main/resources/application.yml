server:
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartchef-ai-api

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  datasource:
    # H2 embebido solo como respaldo de desarrollo. AUTO_SERVER no se usa: H2 lo
    # rechaza junto a DB_CLOSE_ON_EXIT=FALSE y aqui solo hay un proceso.
    url: ${DATABASE_URL:jdbc:h2:file:./data/smartchef;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      encoding: UTF-8

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

smartchef:
  jwt:
    # Clave HS256 en Base64 (openssl rand -base64 48). Obligatoria: sin ella la
    # aplicacion no arranca, para que nunca se firme con un valor conocido.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: 60
    temperature: 0.4
  cors:
    # Origenes externos que pueden llamar a la API desde el navegador, separados
    # por comas. La SPA de este mismo servicio no lo necesita.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Cabecera con la IP real del cliente. Render va detras de Cloudflare, que la
    # escribe en CF-Connecting-IP; vacia, se usa la IP del socket.
    client-ip-header: ${RATE_LIMIT_IP_HEADER:CF-Connecting-IP}
    ai-per-ip:
      max: ${RATE_LIMIT_AI_PER_IP:10}
      window: PT1H
    ai-global:
      # Tope diario de llamadas a Gemini para todo el servicio: protege la cuota
      # aunque alguien rote IPs.
      max: ${RATE_LIMIT_AI_GLOBAL_DAILY:200}
      window: P1D
    login-per-ip:
      max: ${RATE_LIMIT_LOGIN_PER_IP:20}
      window: PT15M
    login-failures-per-account:
      max: ${RATE_LIMIT_LOGIN_FAILURES:5}
      window: PT15M
    register-per-ip:
      max: ${RATE_LIMIT_REGISTER_PER_IP:5}
      window: PT1H
  image:
    max-width: 1024
    resize-threshold-bytes: 1048576
    # Tope de pixeles de la imagen de entrada, comprobado antes de decodificar.
    max-pixels: 50000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.smartchef.api: INFO
